services:
  - type: web
    name: smart-pack-sih
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartpack-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "false"
      - key: CORS_ORIGINS
        value: "*"

databases:
  - name: smartpack-db
    databaseName: smartpack
    user: smartpack
    plan: free
